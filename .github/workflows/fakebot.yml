name: FakeBot 24/7

# 每 6 小时开一班作为兜底;主接力由每班结尾的"接力下一班"步骤自触发,保证零空窗
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # 也允许在 Actions 页面手动点 Run workflow 立即启动

# 同一时刻只允许一个班次在跑:
# cancel-in-progress: false = 新触发排队等待,绝不杀掉正在保活的假人。
concurrency:
  group: fakebot
  cancel-in-progress: false

permissions:
  contents: write        # 允许本工作流向仓库提交, 用于 60 天保活
  actions: write         # 允许本工作流自触发下一班接力

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # GitHub 上限 360;内层 timeout 21540(≈359分)到点后本班收工并接力下一班,零空窗
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install --omit=dev --no-audit --no-fund

      - name: 保活提交 (每班空 commit, 重置 60 天无活动停用定时任务的计时器)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: touch repo to avoid 60-day scheduled-workflow disable"
          git push "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}

      - name: 运行假人 (双服务器 / 方案A 多进程)
        id: runbot
        env:
          AUTHME_PASSWORD: ${{ secrets.AUTHME_PASSWORD }}
          AI_API_KEYS: ${{ secrets.AI_API_KEYS }}
        run: |
          # 方案 A:每个服务器一个独立进程,故障互不牵连。
          # 关键:两个进程都会起健康检查 HTTP 端口(默认 3000),必须给不同 PORT,
          # 否则第二个进程 EADDRINUSE 直接崩溃。Actions 上没人 ping 这个端口,
          # 但代码无条件监听,所以必须区分。
          # timeout 21540≈359分,到点后本班收工,结尾步骤接力下一班实现无缝 24/7。
          PORT=3001 timeout 21540 node src/index.js config-s1.json < /dev/null & P1=$!
          wait $P1; C1=$?

          ok=1
          if [ "$C1" -ne 0 ] && [ "$C1" -ne 124 ]; then ok=0; echo "::error::实例1(config-s1)异常退出,码 $C1 —— 服务器可能已离线!"; fi
          if [ "$ok" -eq 0 ]; then exit 1; fi
          echo "本班双实例正常收工 (退出码 $C1/$C2),准备接力下一班"

      - name: 接力下一班 (无缝衔接,避免空窗导致 Aternos 自动关服)
        if: always()   # 即使上一班异常也尽量接力,保住 24/7;手动 Cancel 整个工作流时本步会被跳过
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          gh workflow run fakebot.yml
